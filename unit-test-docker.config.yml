schema_version: 1

project:
  name: dart_style
  local_dir: dart_style
  image_name: dart_style-test
  dockerfile_path: Dockerfiles/Dockerfile
  workspace_dir: /workspace
  source_dir: /workspace/dart_style
  test_script_path: /workspace/dart_style/test/demo.py
  test_script_template: script/demo.py

base_image:
  optional: true
  value: ark-swalm1-cn-beijing.cr.volces.com/synthesis1/dart_aidp_envdata.3.x:5901503d141098904979e353caed02d5
  strip_scheme_for_from: true

source:
  repo_url: https://github.com/dart-lang/dart_style.git
  commit_id: f662cf6281b9417c1b731ae5639d80e8aaad4187
  clone_depth: 1
  init_submodules: true

platform:
  value: linux/amd64
  reason: base image has no linux/arm64 manifest in the current Apple Silicon Podman environment

podman:
  tls_verify: false
  build_context: .

proxy:
  enabled: true
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

dockerfile_rules:
  workdir: /workspace
  forbid_copy: true
  forbid_add: true
  write_files_with_run_cat_or_echo: true
  run_tests_during_build: false
  omit_cmd_bash: true
  clone_repo_during_build: true

test_output:
  stdout_format: json
  result_keys:
    - passed_tests
    - failed_tests
    - skipped_tests
  progress_stream: stderr

commands:
  build_image: podman build --platform linux/amd64 --tls-verify=false -f Dockerfiles/Dockerfile -t android-upload-test .
  enter_container: podman run --platform linux/amd64 --rm -it android-upload-test /bin/bash
  run_tests: podman run --platform linux/amd64 --rm android-upload-test /workspace/android-upload/test/demo.py --json
  run_tests_in_container: cd /workspace/android-upload/test && python3 demo.py --json
